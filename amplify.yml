version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        # Set environment variables for frontend build
        - export VITE_API_URL=${VITE_API_URL:-https://your-api-domain.com}
        - export VITE_APP_NAME=${VITE_APP_NAME:-"E-commerce Platform"}
        # Build the workspace specified by the environment variable (defaults to customer)
        - npm run build --workspace=${FRONTEND_WORKSPACE:-frontend/customer}
  artifacts:
    # Set the base directory based on the workspace (defaults to customer)
    baseDirectory: ${FRONTEND_WORKSPACE:-frontend/customer}/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
