version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        # Build the customer frontend.
        # If you are deploying the admin panel, change this to: npm run build --workspace=frontend/admin
        - npm run build --workspace=frontend/customer
  artifacts:
    # Set the base directory to the build output of the customer app
    # If deploying admin, change to: frontend/admin/dist
    baseDirectory: frontend/customer/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
