version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Remove stale node_modules (may contain Windows binaries from cache)
        - rm -rf node_modules
        # Fresh install with optional deps (gets Linux-specific rollup/esbuild binaries)
        - npm install --include=optional
        # Explicitly install the Linux rollup native binary
        - npm install @rollup/rollup-linux-x64-gnu --no-save 2>/dev/null || true
    build:
      commands:
        - export VITE_API_URL=${VITE_API_URL:-/backend}
        - export VITE_APP_NAME=${VITE_APP_NAME:-"E-commerce Platform"}
        - npm run build --workspace=${FRONTEND_WORKSPACE:-frontend/customer}
        - mkdir -p build_output
        - cp -r ${FRONTEND_WORKSPACE:-frontend/customer}/dist/. build_output/
  artifacts:
    baseDirectory: build_output
    files:
      - '**/*'
  cache:
    paths: []
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'X-Frame-Options'
          value: SAMEORIGIN
  # Proxy /backend/* → EC2 backend (avoids Mixed-Content: browser sees HTTPS only)
  rewrites:
    - source: /backend/<*>
      target: http://43.204.158.70:4000/<*>
      status: '200'
