version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        # Set environment variables for frontend build
        - export VITE_API_URL=${VITE_API_URL:-https://your-api-domain.com}
        - export VITE_APP_NAME=${VITE_APP_NAME:-"E-commerce Platform"}
        # Build the workspace specified by the environment variable (defaults to customer)
        - npm run build --workspace=${FRONTEND_WORKSPACE:-frontend/customer}
        # Move the build output to a fixed folder because Amplify doesn't support variables in artifacts
        - mkdir -p build_output
        - cp -r ${FRONTEND_WORKSPACE:-frontend/customer}/dist/. build_output/
  artifacts:
    baseDirectory: build_output
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
