upstream backend  { server backend:4000; }
upstream customer { server customer:80;   }
upstream admin    { server admin:80;      }

# ── Redirect HTTP → HTTPS ─────────────────────────────────────────
server {
    listen 80;
    server_name shopnow.digi-wire.com www.shopnow.digi-wire.com admin.shopnow.digi-wire.com;
    return 301 https://$host$request_uri;
}

# ── Customer Frontend: shopnow.digi-wire.com ──────────────────────
server {
    listen 443 ssl;
    server_name shopnow.digi-wire.com www.shopnow.digi-wire.com;

    ssl_certificate     /etc/letsencrypt/live/shopnow.digi-wire.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shopnow.digi-wire.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # REST API proxy → backend
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Socket.io proxy → backend
    location /socket.io/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_read_timeout 86400s;
    }

    # Static frontend
    location / {
        proxy_pass         http://customer;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }
}

# ── Admin Frontend: admin.shopnow.digi-wire.com ───────────────────
server {
    listen 443 ssl;
    server_name admin.shopnow.digi-wire.com;

    ssl_certificate     /etc/letsencrypt/live/shopnow.digi-wire.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shopnow.digi-wire.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass         http://admin;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }
}
