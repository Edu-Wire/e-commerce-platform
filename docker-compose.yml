version: '3.8'

services:

  # ── Nginx Reverse Proxy (single entry point) ──────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: ecom-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - customer
      - admin
    networks:
      - ecom-network

  # ── Backend API ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecom-backend
    restart: unless-stopped
    expose:
      - "4000"
    env_file:
      - ./backend/.env
    volumes:
      - uploads_data:/app/uploads
    networks:
      - ecom-network

  # ── Customer Frontend ─────────────────────────────────────────
  customer:
    build:
      context: ./frontend/customer
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: ecom-customer
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - ecom-network

  # ── Admin Frontend ────────────────────────────────────────────
  admin:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: ecom-admin
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - ecom-network

volumes:
  uploads_data:

networks:
  ecom-network:
    driver: bridge
