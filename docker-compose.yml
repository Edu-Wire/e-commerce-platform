version: '3.8'

services:

  # ── Backend API ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecom-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    volumes:
      - uploads_data:/app/uploads
    networks:
      - ecom-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Customer Frontend ─────────────────────────────────────────
  customer:
    build:
      context: ./frontend/customer
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://43.204.158.70:4000}
    container_name: ecom-customer
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ecom-network

  # ── Admin Frontend ────────────────────────────────────────────
  admin:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://43.204.158.70:4000}
    container_name: ecom-admin
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - ecom-network

volumes:
  uploads_data:

networks:
  ecom-network:
    driver: bridge
