# ─────────────────────────────────────────────────────────────────────────────
# Nginx config for EC2
# Customer frontend  →  http://<EC2-IP>        (port 80)
# Admin frontend     →  http://<EC2-IP>:3001   (port 3001)
# Backend API        →  http://<EC2-IP>:4000   (internal, proxied via /api)
#
# Deploy to EC2:
#   sudo cp nginx.conf /etc/nginx/sites-available/ecom
#   sudo ln -sf /etc/nginx/sites-available/ecom /etc/nginx/sites-enabled/ecom
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# ── Customer Frontend (port 80) ───────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    root /home/ubuntu/e-commerce-platform/frontend/customer/dist;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API proxy → backend
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # Uploads / static files served by backend
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
    }

    # SPA fallback — all routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── Admin Frontend (port 3001) ────────────────────────────────────────────────
server {
    listen 3001;
    server_name _;

    root /home/ubuntu/e-commerce-platform/frontend/admin/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

